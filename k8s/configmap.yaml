apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-config
  namespace: hotel-system
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  MYSQL_HOST: "mysql-service"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "hotel_db"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:80,http://frontend-service"
  JWT_EXPIRATION_MS: "86400000"
