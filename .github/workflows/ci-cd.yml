name: CI/CD Pipeline - Hotel Reservation & Inventory Management

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master

env:
  DOCKER_IMAGE_BACKEND: hotel-backend
  DOCKER_IMAGE_FRONTEND: hotel-frontend

jobs:
  # ============================================================================
  # 1. CONTINUOUS INTEGRATION: BUILD, TEST, AND VALIDATE
  # ============================================================================
  build-and-test:
    name: Build & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      # Backend Test & Verification
      - name: Run Backend Unit & Integration Tests
        run: |
          cd backend
          mvn clean test

      - name: Package Backend Jar Artifact
        run: |
          cd backend
          mvn clean package -DskipTests

      # Frontend Build & Verification
      - name: Install Frontend Dependencies & Build Bundle
        run: |
          cd frontend
          npm install --prefer-offline
          npm run build

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

  # ============================================================================
  # 2. CONTINUOUS DEPLOYMENT: DOCKER BUILD & PUBLISH TO REGISTRY
  # ============================================================================
  docker-build-and-push:
    name: Containerize & Push Images
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and Push Backend Image with SHA and Latest tags
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.DOCKER_IMAGE_BACKEND }}:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.DOCKER_IMAGE_BACKEND }}:v${{ github.run_number }}

      # Build and Push Frontend Image with SHA and Latest tags
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.DOCKER_IMAGE_FRONTEND }}:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.DOCKER_IMAGE_FRONTEND }}:v${{ github.run_number }}

  # ============================================================================
  # 3. KUBERNETES MANIFEST VALIDATION & DEPLOYMENT PREPARATION
  # ============================================================================
  k8s-validation:
    name: Kubernetes Manifests Dry-Run Audit
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

        - name: Kubernetes Manifests Dry-Run Audit
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import glob
          import yaml
          import sys

          files = glob.glob("k8s/*.yaml") + glob.glob("k8s/*.yml")

          if not files:
              print("No Kubernetes manifests found")
              sys.exit(1)

          for file in files:
              print(f"Validating {file}...")
              with open(file, "r", encoding="utf-8") as f:
                  documents = list(yaml.safe_load_all(f))

              for doc in documents:
                  if doc is None:
                      continue

                  if not isinstance(doc, dict):
                      raise ValueError(f"{file}: document is not a YAML object")

                  for field in ("apiVersion", "kind", "metadata"):
                      if field not in doc:
                          raise ValueError(
                              f"{file}: missing required Kubernetes field '{field}'"
                          )

          print(f"Successfully validated {len(files)} Kubernetes manifest files.")
          PY