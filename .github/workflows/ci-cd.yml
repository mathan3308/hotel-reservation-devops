name: CI/CD Pipeline - Hotel Reservation & Inventory Management

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master

env:
  DOCKER_IMAGE_BACKEND: hotel-backend
  DOCKER_IMAGE_FRONTEND: hotel-frontend

jobs:

  # ============================================================================
  # 1. CONTINUOUS INTEGRATION: BUILD, TEST, AND VALIDATE
  # ============================================================================
  build-and-test:
    name: Build & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      # Backend Test & Verification
      - name: Run Backend Unit & Integration Tests
        run: |
          cd backend
          mvn clean test

      - name: Package Backend Jar Artifact
        run: |
          cd backend
          mvn clean package -DskipTests

      # Frontend Build & Verification
      - name: Install Frontend Dependencies & Build Bundle
        run: |
          cd frontend
          npm install --prefer-offline
          npm run build

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

  # ============================================================================
  # 2. CONTINUOUS DEPLOYMENT: DOCKER BUILD & PUBLISH TO REGISTRY
  # ============================================================================
  docker-build-and-push:
    name: Containerize & Push Images
    needs: build-and-test
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and Push Backend Image
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.DOCKER_IMAGE_BACKEND }}:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.DOCKER_IMAGE_BACKEND }}:v${{ github.run_number }}

      # Build and Push Frontend Image
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.DOCKER_IMAGE_FRONTEND }}:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.DOCKER_IMAGE_FRONTEND }}:v${{ github.run_number }}

  # ============================================================================
  # 3. KUBERNETES MANIFEST VALIDATION & DEPLOYMENT PREPARATION
  # ============================================================================
  k8s-validation:
    name: Kubernetes Manifests Dry-Run Audit
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Kubernetes Manifest YAML Audit
        run: |
          python -m pip install --disable-pip-version-check pyyaml

          python - <<'PY'
          import glob
          import sys
          import yaml

          files = sorted(
              glob.glob("k8s/*.yaml") +
              glob.glob("k8s/*.yml")
          )

          if not files:
              print("ERROR: No Kubernetes manifests found")
              sys.exit(1)

          print(f"Found {len(files)} Kubernetes manifest(s)")

          failed = False

          for file in files:
              print(f"\nValidating: {file}")

              try:
                  with open(file, "r", encoding="utf-8") as f:
                      documents = list(yaml.safe_load_all(f))

                  document_count = 0

                  for index, document in enumerate(documents, start=1):
                      if document is None:
                          continue

                      document_count += 1

                      if not isinstance(document, dict):
                          print(
                              f"  ERROR: Document {index} "
                              "is not a valid YAML object"
                          )
                          failed = True
                          continue

                      if not document.get("apiVersion"):
                          print(
                              f"  ERROR: Document {index} "
                              "missing apiVersion"
                          )
                          failed = True

                      if not document.get("kind"):
                          print(
                              f"  ERROR: Document {index} "
                              "missing kind"
                          )
                          failed = True

                  if document_count == 0:
                      print("  ERROR: No Kubernetes resources found")
                      failed = True
                  else:
                      print(
                          f"  YAML structure: OK "
                          f"({document_count} resource(s))"
                      )

              except Exception as e:
                  print(f"  ERROR: {e}")
                  failed = True

          if failed:
              print("\nKubernetes manifest validation FAILED")
              sys.exit(1)

          print("\nKubernetes manifest validation PASSED")
          PY

      - name: Kubernetes Client Dry-Run
        run: |
          set -e

          for file in k8s/*.yaml k8s/*.yml; do
            if [ -f "$file" ]; then
              echo "============================================"
              echo "Dry-run validation: $file"
              echo "============================================"

              kubectl apply \
                --dry-run=client \
                --validate=false \
                -f "$file"
            fi
          done

          echo "============================================"
          echo "Kubernetes client dry-run PASSED"
          echo "============================================"
